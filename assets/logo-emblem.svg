<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Narcos Records — эмблема">
  <defs>
    <!-- Хромированный градиент -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="28%"  stop-color="#C8D2DE"/>
      <stop offset="50%"  stop-color="#6E7686"/>
      <stop offset="72%"  stop-color="#EDF1F6"/>
      <stop offset="100%" stop-color="#98A2B0"/>
    </linearGradient>
    <!-- Неоновая обводка -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1E5BFF"/>
      <stop offset="55%"  stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#B14BFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Внешнее неоновое кольцо -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".85" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="url(#chrome)" stroke-width="1" opacity=".45"/>

  <!-- Трайбл-шипы по осям -->
  <g fill="url(#neon)" opacity=".9">
    <path d="M60 2 63.6 13 60 9.4 56.4 13z"/>
    <path d="M60 118 56.4 107 60 110.6 63.6 107z"/>
    <path d="M2 60 13 56.4 9.4 60 13 63.6z"/>
    <path d="M118 60 107 63.6 110.6 60 107 56.4z"/>
  </g>

  <!-- Хромированная «N» с острыми трайбл-засечками -->
  <path fill="url(#chrome)" d="
    M32 88 L32 32 L45 32 L45 44
    L75 32 L88 32 L88 88 L75 88 L75 62
    L45 76 L45 88 Z
    M45 60 L75 46 L75 50 L45 64 Z"/>

  <!-- Блик -->
  <path fill="#FFFFFF" opacity=".55" d="M32 32 L45 32 L45 38 L32 41 Z"/>
</svg>
